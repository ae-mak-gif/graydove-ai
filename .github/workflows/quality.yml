name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start > /tmp/graydove-next.log 2>&1 &
          echo $! > /tmp/graydove-next.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/graydove-next.log
          exit 1
      - name: Browser smoke tests
        run: npm run test:smoke
